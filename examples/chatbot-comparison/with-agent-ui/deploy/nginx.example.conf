# Illustrative local reverse proxy. Add TLS/certificates for an actual deployment.
server {
    listen 80;
    server_name chat.example.test;
    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }
}
server {
    listen 80;
    server_name ui-host.example.test;
    location / {
        proxy_pass http://127.0.0.1:4183;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
}
